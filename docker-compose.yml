services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      # [수정됨] 컨테이너 안에서도 /app/backend 구조가 유지되도록 매핑 경로를 수정했습니다.
      - ./backend:/app/backend
      - ./utils:/utils
      - ./services:/services
      - ./logs:/logs
      - ./notebook_backend:/app/notebook_backend
    # [수정됨] backend 폴더 안의 main.py를 바라보도록 실행 명령어를 수정했습니다.
    command: uvicorn backend.main:app --reload --host 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  backend_data:
  logs: